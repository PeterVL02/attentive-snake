# Atari defaults for train.algorithm = "dqn" (scripts/train.py --game atari --set train.algorithm=dqn,
# or DQN in the app's New-training form). Laid over configs/atari/default.toml key by key:
# its [ppo] section is dropped, these values replace the shared ones they name, everything
# else (game, model, evaluation, ...) comes from default.toml.
# Not measured yet: the values are those of small-buffer Pong DQN recipes.

[train]
total_env_steps = 2000000
gamma = 0.99
learning_rate = 0.0001
anneal_lr = false
log_interval = 20000          # env steps
checkpoint_interval = 250000  # env steps

[env]
num_envs = 8                  # each step of the 8 games is one iteration (8 env steps)

[dqn]  # attentive_snake.training.dqn.config.DqnConfig
# The buffer keeps observation and next observation as float32, each 4 x 84 x 84 numbers:
# 2 x 16000 x 28224 x 4 bytes = 3.6 GB of RAM. It grows with history_length, screen_size and colour
# (grayscale = false: 3x; history_actions = true: 19x). The DQN paper used 1,000,000 transitions,
# which needs a buffer that stores one byte per pixel and each frame once.
buffer_size = 16000
batch_size = 32
learning_starts = 10000       # transitions in the buffer before the first gradient step
train_frequency = 4           # env steps per round of gradient steps (2 rounds per step of the 8 games)
gradient_steps = 1
target_update_interval = 1000 # env steps between target-network copies
epsilon_start = 1.0
epsilon_end = 0.02
epsilon_fraction = 0.1        # of total_env_steps
max_grad_norm = 10.0
double = true
prioritized = false           # prioritized experience replay (the three priority_* settings apply only when true)
priority_alpha = 0.6
priority_beta_start = 0.4     # rises to 1 at the end of total_env_steps
priority_epsilon = 1e-6
n_step = 1                    # steps a target looks ahead before bootstrapping (1 = plain DQN; 3-5 is common)
dueling = false               # dueling head: Q = V + A - mean(A) (locked when continuing from a checkpoint)
loss = "huber"                # or "mse" (squared error)
