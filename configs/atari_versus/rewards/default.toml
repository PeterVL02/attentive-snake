# The default two-player Atari reward: each player's own points, not clipped.
# The single source of the default reward values (tests check it equals VersusReward()).
# A flat VersusReward table (no section header):
#   reward = scale * (sign(points) if clip else points), for each player
# The score (mean_score) is always the raw sum of the player's points: its margin over the other player.
clip = false                  # true: +1 / -1 per step that wins / loses points, however many
scale = 1.0                   # multiplies the raw (or clipped) points
