# Snake defaults for train.algorithm = "dqn" (scripts/train.py --set train.algorithm=dqn,
# or DQN in the app's New-training form). Laid over configs/snake/default.toml key by key:
# its [ppo] section is dropped, these values replace the shared ones they name, everything
# else (game, model, evaluation, ...) comes from default.toml.

[train]
total_env_steps = 2000000
gamma = 0.99
learning_rate = 0.0001
anneal_lr = false
log_interval = 20000          # env steps
checkpoint_interval = 250000  # env steps

[env]
num_envs = 16                 # each step of the 16 games is one iteration (16 env steps)

[dqn]  # attentive_snake.training.dqn.config.DqnConfig
buffer_size = 100000          # 2 x 100k x 192 numbers (8x8 board, 3 planes) x 4 bytes = ~150 MB
batch_size = 64
learning_starts = 10000       # transitions in the buffer before the first gradient step
train_frequency = 4           # env steps per round of gradient steps (4 rounds per step of the 16 games)
gradient_steps = 1
target_update_interval = 10000 # env steps between target-network copies
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_fraction = 0.1        # of total_env_steps
max_grad_norm = 10.0
double = true
