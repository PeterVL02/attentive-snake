# Default Snake experiment for scripts/train.py (--game snake, the default).
#
# Every field is listed except the [reward] values (see below). A missing key
# (or a whole missing section) takes the dataclass default; an unknown key is
# an error. TOML has no null, so fields
# that may be None are commented out to mean None.
# scripts/train.py writes the full resolved config to <run-dir>/config.toml.

[game]  # name selects the game; the other keys are attentive_snake.games.snake.config.SnakeConfig
name = "snake"
width = 8
height = 8
initial_length = 3
max_steps_without_food = 128  # starvation limit; comment out for no limit (None)

# [reward]: not listed here. The default reward values live in one place, the
# reward scheme configs/snake/rewards/default.toml (= attentive_snake.games.snake.reward.SnakeRewardConfig()),
# and a config without a [reward] section gets exactly those values. To use other
# rewards in your own experiment config, add a [reward] section with the keys to change,
# e.g. copied from another scheme in configs/snake/rewards/.

[model]  # attentive_snake.models.config.ModelConfig (input shape / actions / history come from the env)
# kind: "transformer" (cells as tokens), "cnn" (conv baseline), "hybrid" (conv stem + transformer),
#       "temporal_transformer" (attention over cells of all frames + action tokens),
#       "frame_attention" (CNN per frame, attention across frames).
# Only temporal_transformer and frame_attention treat env.history_length as time; the others
# see stacked frames as extra channels. They use board channels plus, if present, action planes.
kind = "transformer"
d_model = 64
num_heads = 4
num_layers = 3
mlp_ratio = 4
dropout = 0.0
conv_channels = 64            # cnn, hybrid, frame_attention: width of the conv layers
conv_layers = 3               # cnn, hybrid, frame_attention: number of conv layers
kernel_size = 3               # odd; same-padded

[train]  # attentive_snake.training.config.TrainConfig: what every algorithm shares
algorithm = "ppo"             # "ppo" (the [ppo] section below) or "dqn" (its defaults: configs/snake/algorithms/dqn.toml)
total_env_steps = 5000000     # summed over all envs; train.py --steps overrides it
gamma = 0.99
bootstrap_truncated = false    # starving is a rule of the game (own reward, counter not observed): a real end
learning_rate = 0.00025
anneal_lr = true              # linear decay to 0 over total_env_steps
device = "auto"               # "auto" = cuda if available, else cpu
seed = 0
log_interval = 81920          # env steps (one PPO update here is 8192)
# checkpoint_dir = "runs/x"   # set to the run directory by train.py
checkpoint_interval = 819200  # env steps
keep_checkpoints = true       # false: delete older checkpoints after each save (only the latest remains)

[ppo]  # attentive_snake.training.ppo.config.PpoConfig (only with train.algorithm = "ppo")
rollout_length = 128          # steps per env per update (update = rollout_length * num_envs steps)
num_epochs = 4
num_minibatches = 4
gae_lambda = 0.95
clip_coef = 0.2
value_coef = 0.5
entropy_coef = 0.01
max_grad_norm = 0.5
normalize_advantages = true
# target_kl = 0.02            # early-stop an update's epochs above this KL (None = off)

[env]  # attentive_snake.config.EnvConfig
num_envs = 64
history_length = 1            # frames stacked in the observation (newest last); 1 = no history
history_actions = false       # add one-hot planes of the action that produced each frame

[evaluation]  # attentive_snake.evaluation.config.EvalConfig: greedy games played while training (scripts/evaluate.py: afterwards)
interval = 250000             # env steps between evaluations (each saves a checkpoint); 0 = off
games = 100                   # complete games per evaluation
seed = 1000                   # the same checkpoint, seed and games always give the same numbers
max_episode_steps = 10000     # an evaluation game still going after this is stopped as "step_limit"
